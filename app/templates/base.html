<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Bypass</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%2358a6ff' stroke-width='2.5'/><circle cx='16' cy='16' r='7' fill='none' stroke='%2358a6ff' stroke-width='2'/><circle cx='16' cy='16' r='2' fill='%2358a6ff'/></svg>">
    <style>
        :root {
            --bg: #0d1117; --surface: #161b22; --border: #30363d;
            --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
            --green: #3fb950; --red: #f85149; --orange: #d2991d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
               background: var(--bg); color: var(--text); line-height: 1.6; }
        nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; }
        nav a { color: var(--text); text-decoration: none; padding: 1rem 1.5rem; display: inline-block; }
        nav a:hover { background: var(--border); }
        nav .brand { font-weight: bold; color: var(--accent); }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        h1 { color: var(--accent); margin-bottom: 1rem; }
        h2 { margin: 1.5rem 0 1rem; }
        .stats { display: flex; gap: 2rem; margin-bottom: 2rem; }
        .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
                padding: 1.5rem; text-align: center; flex: 1; }
        .stat .number { font-size: 2.5rem; font-weight: bold; color: var(--accent); }
        .stat .label { color: var(--muted); font-size: 0.9rem; margin-top: 0.3rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        tr:hover { background: var(--surface); }
        .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
        .badge-direct { background: #1a3a1a; color: var(--green); }
        .badge-recruiter { background: #3a1a1a; color: var(--red); }
        .badge-matched { background: #1a2a3a; color: var(--accent); }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        form { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
        input, select, button { background: var(--surface); border: 1px solid var(--border);
                color: var(--text); padding: 0.6rem 1rem; border-radius: 6px; font-size: 0.95rem; }
        button { background: var(--accent); color: #000; font-weight: 600; cursor: pointer; border: none; }
        button:hover { opacity: 0.9; }
        .empty { color: var(--muted); text-align: center; padding: 3rem; }
        .job-title { font-weight: 600; }
        .company { color: var(--muted); font-size: 0.9rem; }
        .location { color: var(--muted); font-size: 0.85rem; }
        .pagination { display: flex; gap: 0.5rem; margin-top: 1.5rem; justify-content: center; }
        .pagination a { padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: 6px; }
        .pagination a.active { background: var(--accent); color: #000; border-color: var(--accent); }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="brand">Recruiter Bypass</a>
        <a href="/jobs">Jobs</a>
        <a href="/employers">Employers</a>
        <a href="/agents">Agents</a>
        <a href="/logs">Logs</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
